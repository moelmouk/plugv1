<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Plugin Rec Pro</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #111826;
      --text: #e6ebf2;
      --muted: #93a2b7;
      --border: #1c2636;
      --primary: #3b82f6;
      --primary-600: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --input: #0e1522;
      --shadow: 0 6px 24px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.2);
    }
    [data-theme="light"] {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0b1220;
      --muted: #5b6577;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-600: #1d4ed8;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --input: #f3f4f6;
      --shadow: 0 8px 28px rgba(16,24,40,.12), 0 2px 8px rgba(16,24,40,.08);
    }
    html, body { width: auto; min-width: 320px; max-width: 420px; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      margin: 0; padding: 12px; color: var(--text); background: var(--bg); overflow: auto;
    }
    .app-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: var(--shadow);
      max-height: 560px; overflow: auto;
    }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 10px; color: var(--text); background: linear-gradient(135deg,var(--primary),var(--success)); padding: 2px 6px; border-radius: 999px; }
    .rec { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 0 rgba(239,68,68,.7); transform: scale(1); animation: pulse 1.2s infinite; opacity: 0; }
    .rec.on .rec-dot { opacity: 1; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.7); } 70% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
    .toolbar { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    .btn { flex: 1 1 150px; min-width: 120px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,0)); color: var(--text); cursor: pointer; transition: all .18s ease;
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 1px 0 rgba(255,255,255,.04);
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--primary); box-shadow: 0 6px 16px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.18); }
    .btn-primary { background: linear-gradient(180deg, var(--primary), var(--primary-600)); border-color: transparent; color: #fff; }
    .btn-danger { background: linear-gradient(180deg, var(--danger), #b91c1c); border-color: transparent; color: #fff; }
    .status { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
    .count { font-weight: 700; color: var(--text); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; margin: 8px 0; }
    .field.field--full { grid-template-columns: 1fr; }
    .field label { font-size: 12px; color: var(--muted); }
    .input, .select { width: 110px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input); color: var(--text); outline: none; }
    .input:focus, .select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.25); }
    .hr { height: 1px; background: var(--border); margin: 10px 0; border: 0; }
    .small { font-size: 12px; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0; max-height: 280px; overflow: auto; }
    li.step { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 6px; border: 1px solid var(--border); padding: 8px; margin: 6px 0; background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,0)); border-radius: 10px; }
    .step .meta { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 999px; background: rgba(59,130,246,.15); color: var(--text); margin-left: 6px; }
    .toolbar .btn, .steps-actions .btn { flex: 1 1 150px; }
    .theme-toggle { display: flex; align-items: center; gap: 6px; }
    .toggle { appearance: none; width: 38px; height: 22px; background: var(--border); border-radius: 999px; position: relative; cursor: pointer; outline: none; border: 1px solid var(--border); }
    .toggle:checked { background: var(--primary); }
    .toggle:before { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform .2s ease; }
    .toggle:checked:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="app-card">
    <h1>
      <span class="brand">Plugin Rec Pro <span class="badge">RPA</span> <span id="recIndicator" class="rec"><span class="rec-dot"></span> Recording</span></span>
      <label class="theme-toggle small">Light
        <input id="themeToggle" type="checkbox" class="toggle" />
        Dark
      </label>
    </h1>
    <div class="toolbar">
      <button id="start" class="btn btn-primary">Start</button>
      <button id="stop" class="btn">Stop</button>
    </div>
    <div class="toolbar">
      <button id="play" class="btn">Play</button>
      <button id="clear" class="btn btn-danger">Clear</button>
    </div>
    <div class="status">
      Recording: <span id="rec">false</span> · Actions: <span id="count" class="count">0</span>
    </div>
    <div class="hr"></div>
    <div class="grid">
      <div class="field"><label for="stepDelay">Step delay (ms)</label><input id="stepDelay" class="input" type="number" min="0" step="50" /></div>
      <div class="field"><label for="findTimeout">Find timeout (ms)</label><input id="findTimeout" class="input" type="number" min="0" step="100" /></div>
      <div class="field"><label for="typingMode">Typing mode</label>
        <select id="typingMode" class="select">
          <option value="set">Set value (instant)</option>
          <option value="type">Type (char by char)</option>
        </select>
      </div>
      <div class="field field--full"><label>Actions</label>
        <div class="toolbar steps-actions">
          <button id="export" class="btn">Export</button>
          <button id="import" class="btn">Import</button>
          <input id="importFile" type="file" accept="application/json" style="display:none" />
        </div>
      </div>
    </div>
    <div class="hr"></div>
    <div class="field">
      <label for="waitSelector">waitForSelector</label>
      <input id="waitSelector" class="input" type="text" placeholder="CSS or XPath" />
      <button id="addWaitSelector" class="btn">Add</button>
    </div>
    <div class="field">
      <label for="waitText">waitForText</label>
      <input id="waitText" class="input" type="text" placeholder="Text to appear" />
      <input id="waitTextSelector" class="input" type="text" placeholder="Optional: CSS/XPath scope" />
      <button id="addWaitText" class="btn">Add</button>
    </div>
    <div class="small">Astuce: ajoute des waits entre des clics/saisies si le DOM met du temps à se mettre à jour.</div>
    <div class="hr"></div>
    <h2 class="small">Steps <span class="chip" id="stepsCount">0</span></h2>
    <ul id="steps"></ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
